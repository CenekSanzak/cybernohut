[package]
name = "wasm"
version = "0.1.0"
authors = ["dogukan <dogukanakarc@gmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }
data-encoding = "2.3.3"
base85 = "1.0.0"
md-5 = "0.10.6"
sha1 = "0.10.6"
sha2 = "0.10.6"
serde_json = { version = "1.0.138", features = ["preserve_order", "arbitrary_precision"] }
js-sys = "0.3.77"
serde = { version = "1.0.229", features = ["derive"] }
tsify = "0.5.8"
base64-simd = "0.8.0"
hex-simd = "0.8.0"
regex-lite = "0.1.9"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.5"
hmac = "0.12"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
# Speed over size: the point of the wasm core is throughput on large inputs.
opt-level = 3
lto = true
codegen-units = 1
